[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-tools"
version = "1.0.0"
description = "Research-grade Python toolkit for TikTok internals: public data pipelines, CDN media downloads, and clean-room X-Gnarly / X-Bogus signature implementations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "3MH TECHNOLOGIES" }]
keywords = [
    "tiktok", "research", "api", "reverse-engineering",
    "x-gnarly", "x-bogus", "signature", "osint",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
tiktok-tools = "tiktok_tools.cli:main"

[project.urls]
Homepage = "https://3mh.pages.dev/"
Telegram = "https://t.me/j49_c"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"